<!DOCTYPE html>
<html lang="fa" dir="rtl">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
    <style>
        :root {
            --bg-dark: #011F41;
            --bg-card: #032b59;
            --accent-teal: #21B9C6;
            --accent-gold: #EBA430;
            --text-white: #FFFFFF;
            --text-muted: #a0aec0;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-white);
            padding: 40px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--bg-card);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 { margin-bottom: 20px; color: var(--accent-gold); text-align: center; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: var(--accent-teal); font-weight: bold; }
        input, textarea {
            width: 100%;
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: white;
        }
        button {
            padding: 12px 24px;
            background: var(--accent-teal);
            color: var(--bg-dark);
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { background: #1da2ae; }
        #auth-section, #admin-section { display: none; }
    </style>
</head>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
      projectId: "exalted-avatar-12ts5",
      appId: "1:148363930461:web:ff517777a657869c70d6b4",
      apiKey: "AIzaSyABrpR6TvQbu68HiG9do3pK0soWNcW4KcQ",
      authDomain: "exalted-avatar-12ts5.firebaseapp.com",
      storageBucket: "exalted-avatar-12ts5.firebasestorage.app",
      messagingSenderId: "148363930461"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app, "ai-studio-b0edc278-9d9f-4574-988b-15d1c1e8f3d2");

    const authSection = document.getElementById('auth-section');
    const adminSection = document.getElementById('admin-section');
    const statusDiv = document.getElementById('status');

    onAuthStateChanged(auth, (user) => {
        if (user) {
            authSection.style.display = 'none';
            adminSection.style.display = 'block';
            loadData();
        } else {
            authSection.style.display = 'block';
            adminSection.style.display = 'none';
        }
    });

    
    window.login = () => {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;
        signInWithEmailAndPassword(auth, email, pass)
            .catch((error) => alert('خطا در ورود: ' + error.message));
    };

    window.signup = () => {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;
        createUserWithEmailAndPassword(auth, email, pass)
            .then(() => alert('ثبت نام موفقیت آمیز بود. حالا وارد می‌شوید.'))
            .catch((error) => alert('خطا در ثبت نام: ' + error.message));
    };


    window.logout = () => {
        signOut(auth);
    };

    async function loadData() {
        statusDiv.innerText = 'در حال بارگذاری...';
        try {
            const docRef = doc(db, "content", "main");
            const docSnap = await getDoc(docRef);
            if (docSnap.exists()) {
                const data = docSnap.data();
                
                document.getElementById('heroTitle').value = data.heroTitle || '';
                document.getElementById('heroText').value = data.heroText || '';
                document.getElementById('aboutText').value = data.aboutText || '';
                document.getElementById('s1Title').value = data.s1Title || '';
                document.getElementById('s1Subtitle').value = data.s1Subtitle || '';
                document.getElementById('s1Desc').value = data.s1Desc || '';
                document.getElementById('s1Icon').value = data.s1Icon || '';
                document.getElementById('s1Img').value = data.s1Img || '';
                document.getElementById('s2Title').value = data.s2Title || '';
                document.getElementById('s2Subtitle').value = data.s2Subtitle || '';
                document.getElementById('s2Desc').value = data.s2Desc || '';
                document.getElementById('s2Icon').value = data.s2Icon || '';
                document.getElementById('s2Img').value = data.s2Img || '';
                document.getElementById('s3Title').value = data.s3Title || '';
                document.getElementById('s3Subtitle').value = data.s3Subtitle || '';
                document.getElementById('s3Desc').value = data.s3Desc || '';
                document.getElementById('s3Icon').value = data.s3Icon || '';
                document.getElementById('s3Img').value = data.s3Img || '';
                document.getElementById('s4Title').value = data.s4Title || '';
                document.getElementById('s4Subtitle').value = data.s4Subtitle || '';
                document.getElementById('s4Desc').value = data.s4Desc || '';
                document.getElementById('s4Icon').value = data.s4Icon || '';

                document.getElementById('p2Role').value = data.p2Role || '';
                document.getElementById('p2Achieve').value = data.p2Achieve || '';
                document.getElementById('p2Img').value = data.p2Img || '';
                document.getElementById('team1Name').value = data.team1Name || '';
                document.getElementById('team1Role').value = data.team1Role || '';
                document.getElementById('team1Link').value = data.team1Link || '';
                document.getElementById('team2Name').value = data.team2Name || '';
                document.getElementById('team2Role').value = data.team2Role || '';
                document.getElementById('team2Link').value = data.team2Link || '';
                document.getElementById('team3Name').value = data.team3Name || '';

                document.getElementById('team3Link').value = data.team3Link || '';
                document.getElementById('team4Name').value = data.team4Name || '';

                document.getElementById('team4Link').value = data.team4Link || '';
                document.getElementById('team5Name').value = data.team5Name || '';
                document.getElementById('team5Role').value = data.team5Role || '';
                document.getElementById('team5Link').value = data.team5Link || '';


            }
            statusDiv.innerText = 'اطلاعات بارگذاری شد.';
            setTimeout(() => statusDiv.innerText = '', 2000);
        } catch (e) {
            statusDiv.innerText = 'خطا در بارگذاری.';
        }
    }

    window.saveData = async () => {
        statusDiv.innerText = 'در حال ذخیره...';
        const data = {
            
            heroTitle: document.getElementById('heroTitle').value,
            heroText: document.getElementById('heroText').value,
            aboutText: document.getElementById('aboutText').value,
            s1Title: document.getElementById('s1Title').value,
            s1Subtitle: document.getElementById('s1Subtitle').value,
            s1Desc: document.getElementById('s1Desc').value,
            s1Icon: document.getElementById('s1Icon').value,
            s1Img: document.getElementById('s1Img').value,
            s2Title: document.getElementById('s2Title').value,

            s4Title: document.getElementById('s4Title').value,
            s4Subtitle: document.getElementById('s4Subtitle').value,
            s4Desc: document.getElementById('s4Desc').value,
            s4Icon: document.getElementById('s4Icon').value,
            s4Img: document.getElementById('s4Img').value,
            s5Title: document.getElementById('s5Title').value,
            s5Subtitle: document.getElementById('s5Subtitle').value,
            s5Desc: document.getElementById('s5Desc').value,
            s5Icon: document.getElementById('s5Icon').value,
            s5Img: document.getElementById('s5Img').value,
            s6Title: document.getElementById('s6Title').value,
            s6Subtitle: document.getElementById('s6Subtitle').value,
            s6Desc: document.getElementById('s6Desc').value,
            s6Icon: document.getElementById('s6Icon').value,
            s6Img: document.getElementById('s6Img').value,
            p1Title: document.getElementById('p1Title').value,
            p1Tag: document.getElementById('p1Tag').value,
            p1Role: document.getElementById('p1Role').value,
            p1Achieve: document.getElementById('p1Achieve').value,
            p1Img: document.getElementById('p1Img').value,
            p2Title: document.getElementById('p2Title').value,
            p2Tag: document.getElementById('p2Tag').value,
            p2Role: document.getElementById('p2Role').value,
            p2Achieve: document.getElementById('p2Achieve').value,
            p2Img: document.getElementById('p2Img').value,
            team1Name: document.getElementById('team1Name').value,
            team1Role: document.getElementById('team1Role').value,
            team1Link: document.getElementById('team1Link').value,
            team2Name: document.getElementById('team2Name').value,
            team2Role: document.getElementById('team2Role').value,
            team2Link: document.getElementById('team2Link').value,
            team3Name: document.getElementById('team3Name').value,
            team3Role: document.getElementById('team3Role').value,
            team3Link: document.getElementById('team3Link').value,
            team4Name: document.getElementById('team4Name').value,
            team4Role: document.getElementById('team4Role').value,
            team4Link: document.getElementById('team4Link').value,
            team5Name: document.getElementById('team5Name').value,
            team5Role: document.getElementById('team5Role').value,
            team5Link: document.getElementById('team5Link').value


        };
        try {
            await setDoc(doc(db, "content", "main"), data, { merge: true });
            statusDiv.innerText = 'تغییرات با موفقیت ذخیره شد!';
            setTimeout(() => statusDiv.innerText = '', 3000);
        } catch (e) {
            statusDiv.innerText = 'خطا در ذخیره.';
        }
    };
</script>
